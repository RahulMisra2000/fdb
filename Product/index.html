<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Underwriting Worksheet — Find Your Product</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101826;
    --ink-2:#1B2740;
    --paper:#F6F1E4;
    --paper-2:#EFE7D2;
    --cream:#EDEAE0;
    --ink-text:#16202E;
    --brass:#B8924A;
    --brass-dark:#8C6A2E;
    --teal:#3E7C7B;
    --maroon:#7A3B3B;
    --plum:#5B5A8C;
    --hair-dark: rgba(237,234,224,0.16);
    --hair-light: rgba(22,32,46,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--ink);
    background-image:
      radial-gradient(ellipse at top left, rgba(184,146,74,0.08), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(62,124,123,0.08), transparent 55%);
    color: var(--cream);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding: 40px 20px 60px;
  }
  .stage{ max-width: 980px; margin: 0 auto; }
  .masthead{ text-align:center; margin-bottom: 34px; }
  .masthead .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:11px;
    color: var(--brass);
    margin-bottom:10px;
  }
  .masthead h1{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size: clamp(28px, 4vw, 42px);
    margin: 0 0 10px;
    color: var(--cream);
  }
  .masthead p{
    font-size:15px;
    color: rgba(237,234,224,0.65);
    max-width: 560px;
    margin: 0 auto;
    line-height:1.55;
  }

  .worksheet{
    display:grid;
    grid-template-columns: 260px 1fr;
    gap: 0;
    background: var(--paper);
    color: var(--ink-text);
    border-radius: 6px;
    overflow:hidden;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.55);
    min-height: 460px;
  }
  @media (max-width: 720px){
    .worksheet{ grid-template-columns: 1fr; }
  }

  /* --- Ledger trail (signature element) --- */
  .trail{
    background: var(--paper-2);
    border-right: 1px dashed var(--hair-light);
    padding: 26px 20px;
  }
  .trail-heading{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color: var(--brass-dark);
    margin-bottom: 16px;
  }
  .trail-line{
    position:relative;
    padding: 10px 0 14px 30px;
    border-bottom: 1px dashed var(--hair-light);
    margin-bottom: 2px;
  }
  .trail-line:last-child{ border-bottom:none; }
  .trail-num{
    position:absolute;
    left:0; top:9px;
    width:20px; height:20px;
    border-radius:50%;
    background: var(--brass);
    color: var(--paper);
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    font-weight:600;
    display:flex; align-items:center; justify-content:center;
  }
  .trail-q{
    font-size:11.5px;
    color: rgba(22,32,46,0.55);
    line-height:1.4;
    margin-bottom:4px;
  }
  .trail-a{
    font-size:13px;
    font-weight:600;
    line-height:1.4;
    color: var(--ink-text);
  }
  .trail-empty{
    font-size:12.5px;
    color: rgba(22,32,46,0.45);
    line-height:1.6;
    font-style:italic;
  }

  /* --- Question panel --- */
  .panel{ padding: 34px 36px; display:flex; flex-direction:column; justify-content:center; }
  .q-kicker{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color: var(--teal);
    margin-bottom:12px;
  }
  .q-text{
    font-family:'Source Serif 4', serif;
    font-size: clamp(20px, 2.6vw, 26px);
    font-weight:600;
    line-height:1.35;
    margin: 0 0 26px;
    color: var(--ink-text);
  }
  .options{ display:flex; flex-direction:column; gap:10px; }
  .opt-btn{
    text-align:left;
    background: #fff;
    border: 1px solid var(--hair-light);
    border-left: 3px solid var(--brass);
    border-radius: 3px;
    padding: 14px 16px;
    font-family:'Inter', sans-serif;
    font-size:14.5px;
    font-weight:500;
    color: var(--ink-text);
    cursor:pointer;
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .opt-btn:hover{ background: #fffdf8; transform: translateX(3px); box-shadow: 0 4px 14px rgba(140,106,46,0.18); }
  .opt-btn:focus-visible{ outline: 2px solid var(--teal); outline-offset:2px; }

  /* --- Result card --- */
  .result-badge{
    display:inline-flex; align-items:center; gap:10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color: var(--brass-dark);
    margin-bottom: 10px;
  }
  .seal{
    width:26px; height:26px; border-radius:50%;
    background: var(--brass);
    color:#fff; font-weight:700; font-size:12px;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
  }
  .result-name{
    font-family:'Source Serif 4', serif;
    font-size: clamp(24px, 3vw, 30px);
    font-weight:700;
    margin: 0 0 6px;
    color: var(--ink-text);
  }
  .result-tag{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    padding:3px 9px;
    border-radius:3px;
    color:#fff;
    margin-bottom:18px;
  }
  .tag-annuity{ background: var(--teal); }
  .tag-life{ background: var(--maroon); }
  .facts{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 24px;
    margin: 10px 0 22px;
    font-size:13.5px;
  }
  .facts .fact-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color: rgba(22,32,46,0.5);
    margin-bottom:2px;
  }
  .fact-value{ line-height:1.4; }
  .purpose-line{
    font-size:14.5px;
    line-height:1.6;
    padding: 12px 14px;
    background: rgba(184,146,74,0.10);
    border-left: 3px solid var(--brass);
    border-radius: 3px;
    margin-bottom: 22px;
  }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn-primary, .btn-secondary{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding: 11px 18px;
    border-radius:3px;
    cursor:pointer;
    border:none;
  }
  .btn-primary{ background: var(--ink); color: var(--cream); }
  .btn-primary:hover{ background: var(--ink-2); }
  .btn-secondary{ background:transparent; color: var(--ink-text); border: 1px solid var(--hair-light); }
  .btn-secondary:hover{ background: rgba(22,32,46,0.05); }

  /* --- Toolbar below worksheet --- */
  .toolbar{
    display:flex; justify-content:center; gap:14px; margin-top:26px; flex-wrap:wrap;
  }
  .tool-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.05em;
    background: transparent;
    color: var(--cream);
    border: 1px solid rgba(237,234,224,0.3);
    padding: 12px 20px;
    border-radius: 3px;
    cursor:pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .tool-btn:hover{ border-color: var(--brass); background: rgba(184,146,74,0.10); }
  .tool-btn.accent{ border-color: var(--brass); color: var(--brass); }
</style>
</head>
<body>

<div class="stage">
  <div class="masthead">
    <div class="eyebrow">CFP Product-Selection Worksheet</div>
    <h1>Find the right product</h1>
    <p>Answer a short chain of questions. Each answer narrows the field until exactly one of the 15 hybrid insurance/investment products remains.</p>
  </div>

  <div class="worksheet">
    <aside class="trail" id="trail">
      <div class="trail-heading">Path so far</div>
      <div class="trail-empty">Your answers will appear here as you go.</div>
    </aside>
    <section class="panel" id="panel"></section>
  </div>

  <div class="toolbar">
    <button class="tool-btn" id="restartBtn">↺ Start over</button>
    <button class="tool-btn accent" id="viewAllBtn">☰ View all 15 products</button>
  </div>
</div>

<script>
/* =========================================================
   PRODUCT DATA — 15 hybrid insurance/investment products
   ========================================================= */
const PRODUCTS = [
  {
    id:"myga", num:1, name:"Fixed-Rate Deferred Annuity (MYGA)",
    category:"Annuity", engine:"Fixed rate",
    tax:"Tax-deferred growth; ordinary income on withdrawal (gains-first)",
    common:"Middle class & retirees — the single largest annuity category by sales",
    age:"55–75",
    risk:"Very low",
    liquidity:"Surrender period typically 3–10 yrs; ~10%/yr often free",
    purpose:"A safe, tax-deferred alternative to a bank CD",
    example:"Anita, 62, has $150,000 she won't need for 5 years. She buys a 5-year MYGA guaranteeing 5.5% annually, compounding, tax-deferred — no market exposure at all. Each year the rate is simply credited to her contract automatically.\n\nAfter 5 years, her $150,000 grows to roughly $196,000. She owes no tax along the way; if she then takes it as a lump sum, only the growth portion (about $46,000) is taxed as ordinary income — not the lower capital-gains rate she'd get from a taxable brokerage account.\n\nIf she needs more than the free-withdrawal amount (commonly 10% per year) before the 5-year term ends, she pays a surrender charge that shrinks a little each year of the contract. At the end of the term she can withdraw everything penalty-free, renew at a new rate, or roll it into another annuity."
  },
  {
    id:"fiaStandard", num:2, name:"Fixed Indexed Annuity (FIA) — standard",
    category:"Annuity", engine:"Indexed (capped, 0% floor)",
    tax:"Tax-deferred growth; ordinary income on withdrawal",
    common:"Middle & upper-middle class pre-retirees and retirees",
    age:"55–70",
    risk:"Low",
    liquidity:"Surrender period 5–10 yrs; ~10%/yr often free",
    purpose:"Principal-protected growth with some market-linked upside",
    example:"Rahul, 55, has $100,000 he doesn't need for at least 10 years. He wants better growth than a bank offers, without risking his principal in the stock market. He buys a standard FIA linked to the S&P 500, with an 8% annual cap.\n\nYear 1: the S&P 500 rises 15%. He's credited the 8% cap. Account grows from $100,000 to $108,000.\nYear 2: the S&P 500 rises 3%. He's credited the full 3% (below the cap). Account grows to $111,240.\nYear 3: the S&P 500 falls 20%. He's credited 0% — not negative. His account stays at $111,240; he loses no principal.\nYear 4: the S&P 500 rises 12%. Capped at 8% again. Account grows to $120,139.\n\nAfter 10 years his account has grown steadily — missing the biggest up-years because of the cap, but completely dodging every down-year because of the 0% floor. He can surrender (possibly with a charge, if still inside the surrender period) or take penalty-free withdrawals up to the annual limit. Whatever remains passes to his beneficiaries if he dies."
  },
  {
    id:"fiaRiderProduct", num:3, name:"Fixed Indexed Annuity (FIA) — with income rider (GLWB)",
    category:"Annuity", engine:"Indexed + income rider",
    tax:"Tax-deferred; ordinary income on withdrawal; rider fee is not tax-deductible",
    common:"Middle & upper-middle class retirees wanting guaranteed lifetime income",
    age:"60–75",
    risk:"Low",
    liquidity:"Same as standard FIA, plus an annual rider fee (~0.75–1.5% of the benefit base)",
    purpose:"Guaranteed lifetime income while still keeping control of the account",
    example:"Priya, 55, wants the same principal protection as a standard FIA, but also wants a guarantee of lifetime income starting at retirement. She buys the same type of FIA and adds a GLWB (Guaranteed Lifetime Withdrawal Benefit) rider for an extra ~1%/year fee.\n\nHer contract now tracks two separate numbers. Her real account value grows the same way a standard FIA would (capped index credits, 0% floor), minus the rider fee — after 10 years, say $140,000. Her benefit base — a separate number that exists only to calculate future income — is guaranteed to roll up at 6%/year regardless of the market, reaching about $179,000 after 10 years. She can never withdraw that $179,000 as cash; it's an income-calculation number only.\n\nAt 65, she turns on income. The insurer applies an age-based payout rate — say 5.5% — to her $179,000 benefit base: $9,845 per year, guaranteed for life. That income is drawn from her real account first; if she lives long enough that her real account hits zero, the insurer keeps paying her out of its own pocket. If she dies with money still left in her real account, her heirs receive it — something a SPIA could never offer."
  },
  {
    id:"rila", num:4, name:"Registered Index-Linked Annuity (RILA)",
    category:"Annuity", engine:"Variable, buffered",
    tax:"Tax-deferred growth; ordinary income on withdrawal",
    common:"Upper-middle class & affluent, typically advisor-sold clients",
    age:"50–65",
    risk:"Moderate",
    liquidity:"Surrender period ~6–7 yrs typical",
    purpose:"Higher growth potential than an FIA, with partial (not full) downside protection",
    example:"Sarah, 50, is more comfortable with risk than a typical FIA buyer. She wants a real shot at bigger gains and will accept some downside for a higher cap. She buys a RILA linked to the S&P 500 with a 15% cap and a 10% buffer (the insurer absorbs the first 10% of any loss; she absorbs the rest).\n\nYear 1: S&P 500 rises 20%. She's credited the 15% cap — meaningfully more than an FIA's typical 8% cap would give.\nYear 2: S&P 500 falls 7%. Fully inside her 10% buffer, so she's credited 0% — same protection as an FIA here.\nYear 3: S&P 500 crashes 25%. Her 10% buffer absorbs the first 10%, but she's on the hook for the remaining 15% — her account genuinely loses 15% of its value.\n\nThat's the key difference from an FIA: a bad-enough year can still cost her real money once losses exceed the buffer. Because a RILA carries real loss potential, it's regulated as a security (hence 'Registered') and must be sold by a FINRA-licensed representative, not just someone with a state insurance license."
  },
  {
    id:"vaStandard", num:5, name:"Traditional Variable Annuity — standard",
    category:"Annuity", engine:"Variable / market-invested",
    tax:"Tax-deferred; ordinary income on withdrawal (loses capital-gains treatment)",
    common:"Upper-middle class & rich, usually after maxing other tax-advantaged accounts",
    age:"45–65",
    risk:"High",
    liquidity:"M&E + fund fees ~1–1.5%/yr; surrender period varies by contract",
    purpose:"Tax-deferred market growth beyond 401(k)/IRA contribution limits",
    example:"Tom, 50, already maxes his 401(k) and IRA every year and wants more tax-deferred growth. He puts $100,000 into a variable annuity, invested in stock- and bond-fund subaccounts.\n\nOver 15 years his average return runs about 7%, but a couple of down years (say a 12% drop) hit his account directly — unlike an FIA, there is no floor protecting his principal. By retirement his account has grown to roughly $260,000.\n\nAlong the way he pays ongoing fees — typically 1–1.5% in mortality & expense (M&E) charges plus underlying fund fees — meaningfully higher than the same funds held directly in a brokerage account. When he eventually withdraws, all gains are taxed as ordinary income, not the lower capital-gains rate a taxable account would receive. This is the classic trade-off that makes standard VAs most sensible only after other tax-advantaged options are already maxed out."
  },
  {
    id:"vaRiderProduct", num:6, name:"Traditional Variable Annuity — with income rider (GMWB/GMIB)",
    category:"Annuity", engine:"Variable + income rider",
    tax:"Tax-deferred; ordinary income on withdrawal",
    common:"Upper-middle class & rich retirees wanting market growth plus an income guarantee",
    age:"55–70",
    risk:"Moderate–High",
    liquidity:"Rider fee ~0.75–1.5%/yr on top of M&E/fund fees",
    purpose:"Market growth potential with a guaranteed lifetime income floor",
    example:"Carol, 58, wants both market upside and a guaranteed income floor. She invests $200,000 in a variable annuity and adds a GMWB rider for a 1%/year fee.\n\nHer real account value moves with the market — after 8 strong years, say it has grown to $280,000. Her separate benefit base, guaranteed to roll up 6%/year regardless of market performance, has grown to $319,000. At 66 she turns on lifetime withdrawals: the insurer applies a 5% payout rate to her benefit base, giving her $15,950/year for life.\n\nHad the market crashed instead and her real account fallen to $150,000, her benefit base would still be $319,000 and her guaranteed income completely unaffected — that protection is exactly what the rider fee is paying for."
  },
  {
    id:"spia", num:7, name:"Single Premium Immediate Annuity (SPIA)",
    category:"Annuity", engine:"N/A — already annuitized",
    tax:"Part tax-free return of principal, part ordinary income (exclusion ratio); fully taxable if funded from an IRA",
    common:"Middle class retirees — classic pension-replacement tool",
    age:"65–80",
    risk:"None (income risk is transferred to the insurer)",
    liquidity:"None — the lump sum is irrevocably converted to payments",
    purpose:"Immediate guaranteed income for life, starting now",
    example:"Robert, 68, retires with $300,000 and wants a guaranteed paycheck on top of Social Security. He hands the entire $300,000 to an insurer in exchange for $1,850/month, guaranteed for as long as he lives.\n\nIf he lives to 95, he'll collect far more than $300,000 total. If he dies at 70, the insurer keeps the remaining balance — unless he'd chosen a 'life with 10-year certain' option, which guarantees payments continue to a beneficiary for at least 10 years even if he dies early, in exchange for a slightly smaller monthly check.\n\nBecause this is a non-qualified purchase (not from an IRA), part of each monthly payment is a tax-free return of his own principal, and only the rest is taxed as ordinary income, under an IRS 'exclusion ratio.'"
  },
  {
    id:"dia", num:8, name:"Deferred Income Annuity (DIA)",
    category:"Annuity", engine:"N/A — annuitized, delayed",
    tax:"Same exclusion-ratio tax treatment as a SPIA",
    common:"Middle & upper-middle class forward planners",
    age:"50–65 at purchase; income starts later",
    risk:"None (income risk transferred to insurer)",
    liquidity:"None — committed the moment it's purchased",
    purpose:"Guarantee future income starting on a date you choose today",
    example:"Fatima, 55, is still working but wants to lock in extra guaranteed income starting exactly when she turns 70. She pays $100,000 today for a DIA that begins paying at age 70.\n\nBecause the insurer has 15 years to invest her money before paying anything out, it can guarantee a much larger monthly payment than an immediate annuity bought today would — say $1,100/month for life starting at 70, versus roughly $500/month if she bought a SPIA right now at 55.\n\nLike a SPIA, her $100,000 is committed the moment she buys it — there's no lump sum left to access. Part of each future payment will be a tax-free return of principal under the same exclusion-ratio rule that applies to SPIAs, assuming a non-qualified purchase."
  },
  {
    id:"wholeLife", num:9, name:"Whole Life Insurance",
    category:"Life Insurance", engine:"Fixed (plus potential dividends)",
    tax:"Death benefit income-tax-free; cash value grows tax-deferred; policy loans generally tax-free if the policy stays in force",
    common:"Middle & upper class — by far the largest existing installed base of any hybrid product",
    age:"30–55 at purchase",
    risk:"Very low",
    liquidity:"Cash value low in early years; loans/withdrawals available later",
    purpose:"Permanent, guaranteed protection plus guaranteed cash value",
    example:"David, 40, wants lifelong coverage and likes that cash value builds up guaranteed. He buys a $500,000 whole life policy with a fixed annual premium of about $6,500 — far more than the $30–40/month a healthy 40-year-old would pay for the same face amount in term insurance.\n\nHis premium never changes, even at 70 or 90. His $500,000 death benefit is locked in for life as long as he keeps paying. A portion of each premium builds cash value, guaranteed to grow at a minimum rate (often 2–4%), sometimes boosted by non-guaranteed dividends. By 65, his cash value has grown to roughly $150,000, which he can borrow against (generally tax-free) or withdraw directly (taxable only on gains beyond what he paid in).\n\nThe trade-off: whole life costs 10–15x more than term for the same death benefit, and early-year cash value growth is slow, since much of the early premium covers the cost of insurance and fees rather than savings."
  },
  {
    id:"fixedUL", num:10, name:"Fixed Universal Life",
    category:"Life Insurance", engine:"Fixed, insurer-set rate (adjustable)",
    tax:"Same general tax treatment as whole life",
    common:"Middle & upper-middle class wanting flexible premiums",
    age:"35–55",
    risk:"Low–Moderate (can lapse if underfunded)",
    liquidity:"Cash value accessible via loans/withdrawals",
    purpose:"Flexible-premium permanent coverage with cash accumulation",
    example:"Deepak, 45, wants permanent coverage but likes the flexibility to adjust his premium if his income varies. He buys a $750,000 Fixed Universal Life policy with a target premium of $600/month. His cash value earns a fixed rate the insurer periodically declares (currently 4%, with a guaranteed 2% floor).\n\nIn a strong year he pays extra — $900/month — pushing more into cash value. In a lean year he pays only $400/month, relying on existing cash value to cover the internal cost of insurance. By 60, his cash value has grown to roughly $110,000, which he can borrow against tax-free.\n\nThe risk: if he underfunds the policy for too many years, or the insurer's declared rate drops, his cash value can shrink faster than expected, and the policy can lapse entirely — losing coverage unless he pays a large catch-up premium. This is the classic criticism of universal life relative to whole life's stricter guarantees."
  },
  {
    id:"gul", num:11, name:"Guaranteed Universal Life (GUL)",
    category:"Life Insurance", engine:"Fixed (minimal/no cash value by design)",
    tax:"Death benefit income-tax-free; little to no cash value, so little tax deferral benefit",
    common:"Middle & upper-middle class — estate liquidity and legacy planning",
    age:"45–65",
    risk:"Low, if premiums are paid exactly as scheduled",
    liquidity:"Very low cash value; not designed for access while alive",
    purpose:"The cheapest way to guarantee a permanent death benefit, with no interest in cash value",
    example:"Frank, 55, wants a guaranteed $1,000,000 death benefit to cover future estate taxes, but has zero interest in cash value or investment features — he just wants the cheapest possible way to guarantee that payout, however long he lives. He buys a GUL policy with a fixed premium of $1,450/month, guaranteed to age 121.\n\nThe policy builds almost no cash value — there's nothing meaningful to borrow against or cash out. But as long as Frank pays that exact premium on schedule, the $1,000,000 death benefit is contractually guaranteed whether he dies at 60 or 105.\n\nThis makes GUL roughly 30–40% cheaper than a comparable whole life policy, precisely because he isn't paying for any cash accumulation — only the guarantee itself. The catch: miss payments or let a loan go unpaid, and the no-lapse guarantee can void, with little cash value left to sustain the policy afterward."
  },
  {
    id:"iul", num:12, name:"Indexed Universal Life (IUL)",
    category:"Life Insurance", engine:"Indexed (capped, floor)",
    tax:"Death benefit tax-free; cash value tax-deferred; loans generally tax-free if the policy is managed properly",
    common:"Upper-middle class & rich — often used for supplemental retirement income strategies",
    age:"35–55",
    risk:"Low–Moderate (can lapse if underfunded; caps can change over time)",
    liquidity:"Loans/withdrawals available once meaningful cash value has built up",
    purpose:"Death benefit plus market-linked cash value growth potential",
    example:"Priyanka, 42, wants permanent life insurance but also likes building supplemental retirement income through market-linked cash value. She buys a $500,000 IUL policy, with cash value credited based on the S&P 500's performance, capped at 9%, with a 0% floor.\n\nOver 20 years her cash value grows unevenly — capped gains in good years, 0% in bad years — averaging out to roughly 5–6% net over time. By 62, her cash value has grown to about $280,000. She begins taking tax-free policy loans against it (roughly $20,000/year) to supplement retirement income, since properly structured loans from a life insurance policy are generally not taxed.\n\nIf she dies before repaying any loans, the outstanding balance is simply subtracted from the $500,000 death benefit her family receives."
  },
  {
    id:"vul", num:13, name:"Variable Universal Life (VUL)",
    category:"Life Insurance", engine:"Variable / market-invested",
    tax:"Death benefit tax-free; cash value tax-deferred, with full market risk",
    common:"Rich & sophisticated investors",
    age:"35–55",
    risk:"High",
    liquidity:"Loans/withdrawals possible; market risk affects long-term sustainability",
    purpose:"Death benefit plus direct market growth potential",
    example:"Marcus, 38, is a sophisticated investor who wants permanent life insurance but wants his cash value invested directly in the market for maximum growth, and is comfortable with real risk. He buys a $1,000,000 VUL policy and allocates the cash value across stock and bond subaccounts.\n\nIn strong market years, his cash value grows significantly faster than a whole life or IUL policy would allow, since there's no cap. But in a bad year — say a 30% market drop — his cash value falls by nearly the same amount, and if it falls too low, he may need to pay extra premium to keep the policy from lapsing.\n\nUnlike IUL, there's no floor protecting him from market losses. This makes VUL the highest-risk, highest-potential-reward version of permanent life insurance, generally suited only to people who could comfortably self-insure if the investment approach underperforms."
  },
  {
    id:"hybridLifeLTC", num:14, name:"Hybrid Life/LTC Combo (linked-benefit)",
    category:"Life Insurance", engine:"Fixed (usually) + LTC rider",
    tax:"LTC benefits generally income-tax-free (IRC §7702B); death benefit income-tax-free",
    common:"Upper-middle class & rich — older buyers specifically funding LTC risk",

    risk:"Low",

    purpose:"Long-term care coverage with a death benefit if care is never needed",
    example:"Susan, 60, is worried about a future nursing home cost but doesn't want to pay premiums for standalone long-term care insurance that pays nothing if she never needs care. She buys a hybrid life/LTC policy with a single $100,000 premium, guaranteeing a $200,000 death benefit if she never needs care.\n\nIf she does need care, she can draw down that same $200,000 (often at an accelerated multiple, sometimes totaling $300,000+ available for care) to pay for a nursing home, assisted living, or home health aide — generally income-tax-free under IRS long-term care rules. Whatever isn't used for care still passes to her heirs as a death benefit.\n\nThis 'use it for care, or leave it to family' structure is exactly why hybrid policies have grown popular relative to standalone LTC insurance, which historically saw steep premium increases and paid out nothing at all if care was never needed."
  },
  {
    id:"hybridAnnuityLTC", num:15, name:"Hybrid Annuity/LTC Combo",
    category:"Annuity", engine:"Fixed/Indexed (usually) + LTC rider",
    tax:"LTC withdrawals often tax-free for qualified expenses; other withdrawals taxed as ordinary annuity income",
    common:"Rich & high-net-worth — a genuinely niche product",
    age:"55–70",
    risk:"Low",
    liquidity:"Designed as a long-term hold; limited early liquidity",
    purpose:"Self-funding long-term care risk on an annuity chassis, with easier underwriting",
    example:"George, 63, has $150,000 in a low-yield account and is more focused on self-funding future care costs than on leaving money to heirs. He buys a hybrid annuity/LTC policy, depositing his $150,000, which grows on a fixed or indexed basis like a normal deferred annuity.\n\nIf he never needs long-term care, he can withdraw the account like any annuity, under normal tax rules. But if he's certified as needing long-term care, the policy multiplies his available benefit — say 2–3x his account value — paying out roughly $300,000–$450,000 specifically for qualified LTC expenses, often with more lenient health underwriting than a standalone LTC policy would require, since the insurer is less exposed if he never actually needs care.\n\nWithdrawals used for qualified LTC expenses are generally tax-free, while ordinary withdrawals not used for care are taxed as regular annuity income."

/* =========================================================
   DECISION TREE
   ========================================================= */
const QUESTIONS = {
  start: {
    text: "What do you want this money to eventually do?",
    options: [
      { label:"Grow or protect a lump sum, mainly for me", next:"incomeTiming" },
      { label:"Guarantee money for my family when I die", next:"cashValueImportance" },
      { label:"Specifically protect against future long-term care costs", next:"ltcWrapper" }
    ]
  },
  incomeTiming: {
    text: "Do you need income to start now, or can it wait?",
    options: [
      { label:"Income needed within about 12 months", result:"spia" },
      { label:"Income can wait until a specific future date I'm ready to commit to now", result:"dia" },
      { label:"Not ready to commit to an income date — I want flexibility", next:"riskTolerance" }
    ]
  },
  riskTolerance: {
    text: "How much investment risk are you comfortable with?",
    options: [
      { label:"None — I want a guaranteed fixed rate, like a CD", result:"myga" },
      { label:"None to my principal, but I'd like some market-linked upside", next:"fiaRider" },
      { label:"Some downside is fine if it means a meaningfully higher upside cap", result:"rila" },
      { label:"I'm fully comfortable with real market risk (gains and losses)", next:"vaRider" }
    ]
  },
  fiaRider: {
    text: "Do you want a guaranteed lifetime paycheck locked in today, on top of keeping your account?",
    options: [
      { label:"No — just let it grow, I'll decide on income later", result:"fiaStandard" },
      { label:"Yes — I want that guarantee attached today", result:"fiaRiderProduct" }
    ]
  },
  vaRider: {
    text: "Do you want a guaranteed lifetime paycheck locked in today, on top of keeping your account?",
    options: [
      { label:"No — just let it grow in the market", result:"vaStandard" },
      { label:"Yes — I want that guarantee attached today", result:"vaRiderProduct" }
    ]
  },
  cashValueImportance: {
    text: "Is cash value growth actually important to you, or do you just want the cheapest possible guaranteed death benefit for life?",
    options: [
      { label:"Just the cheapest guaranteed death benefit — I don't care about cash value", result:"gul" },
      { label:"I want real cash value growth too", next:"cashGrowthType" }
    ]
  },
  cashGrowthType: {
    text: "How do you want that cash value to grow?",
    options: [
      { label:"Fixed, guaranteed rate — the simplest, most guaranteed option", result:"wholeLife" },
      { label:"Fixed, guaranteed rate, but with flexible premiums and death benefit", result:"fixedUL" },
      { label:"Linked to a market index — capped, but can't lose value", result:"iul" },
      { label:"Directly invested in the market — real upside and real downside", result:"vul" }
    ]
  },
  ltcWrapper: {
    text: "Would you rather this be structured as life insurance or as an annuity?",
    options: [
      { label:"Life insurance — I want a death benefit if long-term care is never needed", result:"hybridLifeLTC" },
      { label:"Annuity — I want LTC coverage layered on top of accumulating annuity money", result:"hybridAnnuityLTC" }
    ]
  }
};

/* =========================================================
   STATE + RENDERING
   ========================================================= */
let path = [];
let currentQ = "start";
let result = null;

function productById(id){ return PRODUCTS.find(p => p.id === id); }

function renderTrail(){
  const trail = document.getElementById("trail");
  if(path.length === 0){
    trail.innerHTML = '<div class="trail-heading">Path so far</div><div class="trail-empty">Your answers will appear here as you go.</div>';
    return;
  }
  let html = '<div class="trail-heading">Path so far</div>';
  path.forEach((step, i) => {
    html += `<div class="trail-line">
      <div class="trail-num">${i+1}</div>
      <div class="trail-q">${step.question}</div>
      <div class="trail-a">${step.answer}</div>
    </div>`;
  });
  trail.innerHTML = html;
}

function renderPanel(){
  const panel = document.getElementById("panel");
  if(result){
    const p = productById(result);
    const tagClass = p.category === "Annuity" ? "tag-annuity" : "tag-life";
    panel.innerHTML = `
      <div class="result-badge"><span class="seal">${p.num}</span> Match found — product ${p.num} of 15</div>
      <h2 class="result-name">${p.name}</h2>
      <span class="result-tag ${tagClass}">${p.category}</span>
      <div class="facts">
        <div><div class="fact-label">Growth engine</div><div class="fact-value">${p.engine}</div></div>
        <div><div class="fact-label">Risk level</div><div class="fact-value">${p.risk}</div></div>
        <div><div class="fact-label">Tax treatment</div><div class="fact-value">${p.tax}</div></div>
        <div><div class="fact-label">Typical buyer age</div><div class="fact-value">${p.age}</div></div>
        <div><div class="fact-label">Most common with</div><div class="fact-value">${p.common}</div></div>
        <div><div class="fact-label">Liquidity</div><div class="fact-value">${p.liquidity}</div></div>
      </div>
      <div class="purpose-line">${p.purpose}</div>
      <div class="btn-row">
        <button class="btn-primary" onclick="openExampleWindow('${p.id}')">Read a full real-world example →</button>
        <button class="btn-secondary" id="restartBtn2">Start over</button>
      </div>
    `;
    document.getElementById("restartBtn2").addEventListener("click", restart);
  } else {
    const q = QUESTIONS[currentQ];
    let html = `<div class="q-kicker">Question ${path.length + 1}</div>
      <h2 class="q-text">${q.text}</h2>
      <div class="options">`;
    q.options.forEach((opt, i) => {
      html += `<button class="opt-btn" data-idx="${i}">${opt.label}</button>`;
    });
    html += `</div>`;
    panel.innerHTML = html;
    panel.querySelectorAll(".opt-btn").forEach(btn => {
      btn.addEventListener("click", () => selectOption(parseInt(btn.dataset.idx)));
    });
  }
}

function selectOption(idx){
  const q = QUESTIONS[currentQ];
  const opt = q.options[idx];
  path.push({ question: q.text, answer: opt.label });
  if(opt.result){
    result = opt.result;
    currentQ = null;
  } else {
    currentQ = opt.next;
  }
  renderTrail();
  renderPanel();
}

function restart(){
  path = [];
  currentQ = "start";
  result = null;
  renderTrail();
  renderPanel();
}

document.getElementById("restartBtn").addEventListener("click", restart);
